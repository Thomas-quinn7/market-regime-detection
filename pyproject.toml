[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "market-regime-detection"
version = "0.0.1"
description = "Volatility-regime detection in equity index returns with a look-ahead-free Markov-switching model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thomas Quinn" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "yfinance>=0.2.40",
    "fredapi>=0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Ruff's default core (pyflakes + the important pycodestyle checks) plus warnings, pinned so CI is
# stable across ruff versions. Line-length (E501) is intentionally not enforced; long docstring lines
# are fine and the code is formatted to ~100 cols by hand.
select = ["E4", "E7", "E9", "F", "W"]
